# Blueprint da Render — https://render.com/docs/blueprint-spec
#
# DOIS ambientes, do mesmo repositório, em branches diferentes:
#
#   cutflow      ← branch `producao`  → banco Neon `main` (dados reais)
#   cutflow-dev  ← branch `main`      → branch Neon `dev` (descartável)
#
# O portão entre eles é um PR de `main` para `producao`. Nada chega às
# barbearias sem passar por lá.
#
# A aplicação é UM processo Node que serve a API e o front compilado. Não há
# estado em memória entre requisições — rate limit e bloqueio de login vivem na
# tabela `limites_uso` —, então mais de uma instância funciona sem ajuste.
#
# Cada serviço pede duas connection strings no painel (`sync: false`, ou seja,
# nunca guardadas aqui). E são bancos DIFERENTES em cada serviço: apontar o dev
# para o banco de produção derruba justamente o isolamento que este arquivo
# existe para criar.

# ── Onde cada um atende ───────────────────────────────────────────────────────
#
#   cutflow      → https://cutflow-ppdp.onrender.com/
#   cutflow-dev  → serviço `cutflow-dev` na Render
#
# O sufixo `-ppdp` é gerado pela Render e NÃO sai do `name` abaixo: quem tentar
# `cutflow.onrender.com` bate em nada. Está escrito aqui porque verificar um
# deploy exige a URL, e ela não vem deste arquivo.

services:
  # ── PRODUÇÃO ────────────────────────────────────────────────────────────────
  - type: web
    name: cutflow
    runtime: node
    plan: free
    branch: producao

    # Ohio é a região mais próxima do banco.
    #
    # O Neon está em `us-east-2` (Ohio) desde a migração. Manter os dois no
    # mesmo lado evita os ~120 ms por consulta que havia com o banco em São
    # Paulo — e as rotas com rate limit fazem uma consulta a mais por requisição.
    region: ohio

    # `--include=dev` é obrigatório aqui, e o motivo não é óbvio.
    #
    # O `NODE_ENV=production` declarado mais abaixo vale também para o BUILD, e
    # com ele o `npm ci` pula as devDependencies. O `vite` é devDependency — e
    # deve ser, é ferramenta de build, não código que roda em produção. Sem o
    # flag, o build instala só as dependências de produção e morre em
    # "sh: 1: vite: not found".
    #
    # `npm run release` escolhe a credencial sozinho: usa DATABASE_URL_MIGRACAO
    # (papel dono) quando existe, e cai para DATABASE_URL quando não. A escolha
    # mora em scripts/migrate.js, e não numa linha de shell aqui — porque aqui
    # ela falhava calada: com a variável ausente, `DATABASE_URL="$OUTRA"` virava
    # string vazia e o erro apontava para a variável errada.
    #
    # O release está no build porque `preDeployCommand` só existe nos planos
    # pagos. A migração é idempotente e só adiciona.
    buildCommand: npm ci --include=dev && npm run build && npm run release
    startCommand: npm start

    # Deploy NÃO é automático aqui — quem dispara é o
    # .github/workflows/deploy.yml, e só depois de lint, build, guardas, smoke
    # e isolamento passarem.
    #
    # Antes disto, qualquer commit que aparecesse em `producao` subia para as
    # barbearias com ou sem CI: o PR de `main` para `producao` é convenção, não
    # trava, porque branch protection não está disponível neste repositório
    # (privado em plano free). A trava deixou de ser "não dá para mergear" e
    # virou "não dá para deployar", que é a que protege a barbearia.
    #
    # ATENÇÃO: esta linha só manda se o serviço for gerenciado pelo Blueprint.
    # Se ele foi criado pelo painel, o Auto-Deploy de lá é quem vale — desligue
    # nos dois lugares.
    autoDeploy: false

    # Responde {"ok":true} sem tocar no banco: serve para a Render saber que a
    # instância subiu, e não vira consulta a cada checagem.
    healthCheckPath: /api/health

    envVars:
      # Liga o `secure` do cookie de sessão e o HSTS. Sem isto o cookie
      # trafega em HTTP puro — o servidor avisa em voz alta no log.
      - key: NODE_ENV
        value: production

      # A Render fica atrás de um proxy. Sem isto, todos os visitantes chegam
      # com o IP do proxy e dividem o mesmo balde de rate limit: o primeiro
      # abusador bloquearia todo mundo.
      - key: TRUST_PROXY
        value: "1"

      # Gerado pela Render (256 bits em base64, bem acima do mínimo de 32
      # caracteres que server/auth.js exige). Trocar este valor desconecta
      # todas as sessões ativas.
      - key: JWT_SECRET
        generateValue: true

      # Papel `cutflow_app`: só lê e escreve nas tabelas. É a credencial que o
      # processo carrega enquanto atende requisição. Gerada por
      # `npm run db:papel-app`.
      - key: DATABASE_URL
        sync: false

      # Papel dono: faz DDL. Usada só pelo release, dentro do build.
      - key: DATABASE_URL_MIGRACAO
        sync: false

  # ── DESENVOLVIMENTO ─────────────────────────────────────────────────────────
  # Mesmo código, banco descartável. É aqui que feature nova chega primeiro.
  #
  # Este SEGUE com deploy automático, de propósito: o valor de um ambiente de
  # dev é ver a mudança no ar rápido, e o custo de uma quebra aqui é zero — não
  # há barbearia do outro lado. O portão fica onde o estrago existe.
  - type: web
    name: cutflow-dev
    runtime: node
    plan: free
    branch: main
    region: ohio

    buildCommand: npm ci --include=dev && npm run build && npm run release
    startCommand: npm start
    healthCheckPath: /api/health

    envVars:
      # `production` também aqui, de propósito: é o modo que vai para as
      # barbearias, e bug que só aparece nele precisa aparecer no dev antes.
      - key: NODE_ENV
        value: production

      - key: TRUST_PROXY
        value: "1"

      # Segredo próprio: sessão de dev não vale em produção, e vice-versa.
      - key: JWT_SECRET
        generateValue: true

      # ATENÇÃO: estas DUAS apontam para a branch `dev` do Neon, nunca para o
      # banco de produção. É o que separa dado de teste de dado de barbearia.
      - key: DATABASE_URL
        sync: false

      - key: DATABASE_URL_MIGRACAO
        sync: false

# ── Duas coisas para decidir ──────────────────────────────────────────────────
#
# 1. PLANO FREE HIBERNA.
#    A instância dorme após ~15 min sem tráfego e o próximo acesso espera ~50 s.
#    Em dev, tanto faz. Em produção, com barbearia real abrindo o link, parece
#    site fora do ar — e agora há barbearias de verdade usando. O plano Starter
#    mantém de pé e libera o `preDeployCommand`.
#
# 2. DOIS SERVIÇOS FREE = DUAS HIBERNAÇÕES.
#    Se for pagar por um só, pague o de produção.
